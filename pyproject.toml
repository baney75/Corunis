[project]
name = "corunis"
version = "0.1.0"
description = "Corunis brain: a local MCP server that answers only from a group's own documents"
license = "MIT"
requires-python = ">=3.11"
# The server runs on the standard library alone. pypdf (BSD-3-Clause) is an optional extra for PDF text.
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4"]

[dependency-groups]
dev = ["pytest>=8", "pypdf>=4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
